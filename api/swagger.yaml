openapi: 3.1.0
info:
  title: http2prefix — IP Address & ASN Lookup API
  description: |
    Resolves IP addresses to BGP AS numbers (prefix2as) and AS numbers to
    announced IP prefixes (as2prefix).

    Two MMDB databases are built automatically from gzipped CSVs fetched from
    the letstool CDN and refreshed once per day at noon (local time):
    - **prefix2as** — `https://cdn.letstool.net/prefix2as/csv` (`prefix,origins` — origins is space-separated ASNs)
    - **as2prefix** — `https://cdn.letstool.net/as2prefix/csv` (`asn,prefixes,peers,upstreams,downstreams` — values are space-separated; peers/upstreams/downstreams are merged into a single sorted peer list)

    A single endpoint (`POST /api/v1/asprefix`) auto-detects the query type:
    - **IP address** (IPv4 or IPv6) → queries the `prefix2as` database
    - **AS number** (e.g. `AS13335`, case-insensitive) → queries the `as2prefix` database
  version: 1.0.0
  license:
    name: MIT

servers:
  - url: http://localhost:8080
    description: Local server

paths:

  /api/v1/asprefix:
    post:
      summary: Look up an IP address or AS number
      description: |
        Accepts a **single query** containing either an IP address or an AS number.

        **Query type detection:**
        - If the query is a valid IPv4 or IPv6 address → routes to the `prefix2as` database.
          Returns the matched BGP prefix and its originating AS number, name, and country.
        - If the query matches `AS<number>` (case-insensitive, e.g. `AS13335`, `as13335`) →
          routes to the `as2prefix` database. Returns the AS metadata and all announced prefixes.

        **Response `query_type`** field indicates which database was queried:
        `"ip"` or `"asnum"`.

      operationId: lookup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LookupRequest"
            examples:
              ipv4:
                summary: IPv4 address lookup
                value:
                  query: "1.1.1.1"
              ipv6:
                summary: IPv6 address lookup
                value:
                  query: "2606:4700::"
              asnum_upper:
                summary: AS number (uppercase)
                value:
                  query: "AS13335"
              asnum_lower:
                summary: AS number (lowercase)
                value:
                  query: "as13335"

      responses:
        "200":
          description: Lookup result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LookupResponse"
        "405":
          description: Method not allowed — only POST is accepted

  /db/prefix2as:
    get:
      summary: Download the current prefix2as.mmdb database file
      description: |
        Serves the current `prefix2as.mmdb` binary for peer instances that want to
        synchronise without fetching from the CDN.
      operationId: getPrefix2asDB
      responses:
        "200":
          description: prefix2as.mmdb binary file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Database not yet built

  /db/as2prefix:
    get:
      summary: Download the current as2prefix.mmdb database file
      description: |
        Serves the current `as2prefix.mmdb` binary for peer instances that want to
        synchronise without fetching from the CDN.
      operationId: getAs2prefixDB
      responses:
        "200":
          description: as2prefix.mmdb binary file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Database not yet built

  /openapi.json:
    get:
      summary: OpenAPI 3.1 specification (this document, JSON format)
      operationId: getOpenAPI
      responses:
        "200":
          description: OpenAPI JSON document
          content:
            application/json: {}

  /:
    get:
      summary: Embedded interactive web UI
      description: |
        Browser-based interface for IP address and AS number lookup.
        Supports dark/light themes and 9 languages with RTL support.
      operationId: getUI
      responses:
        "200":
          description: HTML web UI
          content:
            text/html: {}

components:
  schemas:

    LookupRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          description: >
            IP address (IPv4 or IPv6) or AS number in the format `AS<number>`
            (case-insensitive). Examples: `"1.1.1.1"`, `"2606:4700::"`,
            `"AS13335"`, `"as15169"`.
          example: "1.1.1.1"

    LookupResponse:
      type: object
      required: [status, query_type, query]
      properties:
        status:
          type: string
          enum: [SUCCESS, NOTFOUND, ERROR]
          description: |
            - `SUCCESS`: query matched a record in the database.
            - `NOTFOUND`: query was valid but no record was found.
            - `ERROR`: malformed request, unknown query type, or database not yet initialised.
        query_type:
          type: string
          enum: [ip, asnum, unknown]
          description: >
            The detected query type. `"ip"` for IP address queries (prefix2as),
            `"asnum"` for AS number queries (as2prefix), `"unknown"` for unrecognised input.
        query:
          type: string
          description: The original query string as received.
        answer:
          oneOf:
            - $ref: "#/components/schemas/IPAnswer"
            - $ref: "#/components/schemas/ASAnswer"
          description: >
            Present on `SUCCESS` and `NOTFOUND` statuses.
            The schema depends on `query_type`: `IPAnswer` for `"ip"`, `ASAnswer` for `"asnum"`.

    PrefixInfo:
      type: object
      description: A BGP prefix paired with its address count.
      required: [prefix, size]
      properties:
        prefix:
          type: string
          description: The CIDR prefix string.
          example: "1.1.1.0/24"
        size:
          type: string
          description: >
            Number of IP addresses in this prefix.
            Decimal for IPv4 (e.g. `"256"` for a /24, `"16777216"` for a /8).
            Power-of-two notation for IPv6 (e.g. `"2^96"` for a /32, `"2^80"` for a /48).
            `"1"` for a host route (/32 IPv4 or /128 IPv6).
          example: "256"

    IPAnswer:
      type: object
      description: >
        Answer for an IP address query (prefix2as lookup).
        A prefix may be originated by multiple ASes (MOAS — Multiple Origin AS).
      required: [ip]
      properties:
        ip:
          type: string
          description: The queried IP address in canonical form.
          example: "1.1.1.1"
        prefix:
          type: string
          description: The BGP prefix that matches the queried IP address.
          example: "1.1.1.0/24"
        size:
          type: string
          description: >
            Number of IP addresses in the matched prefix.
            Decimal for IPv4, power-of-two notation for IPv6.
          example: "256"
        origins:
          type: array
          description: >
            AS numbers originating this prefix. More than one entry indicates a MOAS prefix
            (announced by multiple ASes simultaneously).
          items:
            type: integer
            format: int64
          example: [13335]

    ASAnswer:
      type: object
      description: >
        Answer for an AS number query (as2prefix lookup).
        Prefixes are sorted: IPv4 ascending by network address, then IPv6 ascending.
        Peers is the merged, deduplicated, ascending-sorted union of all BGP neighbours
        (peers, upstreams, and downstreams as classified by db2prefix).
      required: [asnum, prefixes]
      properties:
        asnum:
          type: integer
          format: int64
          description: The AS number.
          example: 13335
        prefixes:
          type: array
          description: >
            All BGP prefixes announced by this AS, each with its address count.
            Sorted: IPv4 ascending by network address, then IPv6 ascending by network address.
          items:
            $ref: "#/components/schemas/PrefixInfo"
          example:
            - {prefix: "1.0.0.0/24",      size: "256"}
            - {prefix: "1.1.1.0/24",      size: "256"}
            - {prefix: "2606:4700::/32",  size: "2^96"}
        peers:
          type: array
          description: >
            Merged, deduplicated, ascending-sorted union of all BGP neighbours
            (peers + upstreams + downstreams as classified by db2prefix).
            Absent if the AS has no known BGP neighbours.
          items:
            type: integer
            format: int64
          example: [174, 3356, 6939]
